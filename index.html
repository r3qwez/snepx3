<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>x3</title>
    <style>
        /* Черный фон и центрирование всего содержимого */
        body {
            background-color: #000000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Контейнер, чтобы текст и гифка стояли друг под другом */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Расстояние между текстом и гифкой */
        }
        /* Стиль для текста x3 */
        h1 {
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            font-size: 2rem;
        }
        /* Настройки размера гифки */
        img {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>x3</h1>
        <img src="snep.gif" alt="Снежный барс">
    </div>
</body>
</html>
